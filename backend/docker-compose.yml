services:
  postgres:
    image: postgres:17-alpine
    container_name: linklist-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: linklist
      POSTGRES_USER: linklist
      POSTGRES_PASSWORD: linklist
    ports:
      - "5432:5432"
    volumes:
      - linklist_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linklist -d linklist"]
      interval: 5s
      timeout: 5s
      retries: 10
  minio:
    image: minio/minio:latest
    container_name: linklist-minio
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - linklist_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: ["mc alias set local http://minio:9000 minioadmin minioadmin && mc mb --ignore-existing local/linklist && mc anonymous set download local/linklist"]

volumes:
  linklist_postgres_data:
  linklist_minio_data:
