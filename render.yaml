services:
  - type: web
    name: linklist-api
    runtime: node
    plan: free
    autoDeploy: yes
    buildCommand: npm ci --include=dev && npm run prisma:generate --workspace=backend && npm run build --workspace=backend
    startCommand: npm run prisma:migrate:deploy --workspace=backend && npm run start:prod --workspace=backend
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: AUTH_MODE
        value: firebase
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_ORIGINS
        value: http://localhost:3000,https://linklist-beta-cnin.netlify.app,https://*--linklist-beta-cnin.netlify.app
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: SIGNUP_TICKET_SECRET
        generateValue: true
      - key: R2_ENDPOINT
        sync: false
      - key: R2_REGION
        value: auto
      - key: R2_BUCKET
        value: linklist-beta-images
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
